# Application
spring.application.name=inventory-app
# App Platform: SPRING_PROFILES_ACTIVE=prod. Local default is local (DEBUG logs, env=local).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.data.mongodb.uri=${DB_URI}
client.url=${CLIENT_URL}

# Management
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.mongo.connectionpool.enabled=true

# HTTP is counted in HttpServerExtraMetricsFilter (Counters only — OTLP histograms do not
# produce Prometheus _count/_bucket in Grafana Cloud).
management.metrics.web.server.max-uri-tags=250
management.observations.enable.[http.server.requests]=false
# Tomcat thread pool gauges (tomcat_threads_busy_threads, _current_threads, _config_max_threads):
# how many of the 200 request threads are in use; the infrastructure dashboard graphs them.
server.tomcat.mbeanregistry.enabled=true

# Grafana Cloud: OTLP/Loki push only on the prod profile, and only if GRAFANA_CLOUD_OTLP_URL / LOKI_URL are set.
management.otlp.metrics.export.enabled=false

grafana.cloud.api-token=${GRAFANA_CLOUD_API_TOKEN:}
grafana.cloud.otlp.url=${GRAFANA_CLOUD_OTLP_URL:}
grafana.cloud.otlp.user=${GRAFANA_CLOUD_OTLP_USER:}
grafana.cloud.loki.url=${GRAFANA_CLOUD_LOKI_URL:}
grafana.cloud.loki.user=${GRAFANA_CLOUD_LOKI_USER:}

# MongoDB transactions for the money flows (bill completion, refund, vendor invoice and return,
# credit charge and settlement), see MongoTx. false = no transactions (the behaviour before).
# A shop's flows take turns in this container (waiting up to shop-wait-ms, then 503 "busy"); a flow
# that still loses a write conflict is run again, up to max-attempts times.
mongo.transactions.enabled=${MONGO_TRANSACTIONS_ENABLED:true}
mongo.transactions.max-attempts=${MONGO_TRANSACTIONS_MAX_ATTEMPTS:5}
mongo.transactions.shop-wait-ms=${MONGO_TRANSACTIONS_SHOP_WAIT_MS:15000}
# MongoDB: longest wait for a free pooled connection before failing fast with 503 "busy" (driver default 120 s)
mongo.pool.max-wait-ms=${MONGO_POOL_MAX_WAIT_MS:2000}
# Heavy requests per container (HeavyRequestLimiter): run at once / web requests waiting / wait ms
# (+ background wait for the phone upload's parsing). Over the line or the wait: 503 busy + Retry-After.
heavy.export.limit=${HEAVY_EXPORT_LIMIT:1}
heavy.export.queue=${HEAVY_EXPORT_QUEUE:3}
heavy.export.wait-ms=${HEAVY_EXPORT_WAIT_MS:20000}
heavy.analytics.limit=${HEAVY_ANALYTICS_LIMIT:3}
heavy.analytics.queue=${HEAVY_ANALYTICS_QUEUE:6}
heavy.analytics.wait-ms=${HEAVY_ANALYTICS_WAIT_MS:10000}
heavy.ocr.limit=${HEAVY_OCR_LIMIT:2}
heavy.ocr.queue=${HEAVY_OCR_QUEUE:4}
heavy.ocr.wait-ms=${HEAVY_OCR_WAIT_MS:15000}
heavy.ocr.background-wait-ms=${HEAVY_OCR_BACKGROUND_WAIT_MS:300000}
heavy.import.limit=${HEAVY_IMPORT_LIMIT:1}
heavy.import.queue=${HEAVY_IMPORT_QUEUE:2}
heavy.import.wait-ms=${HEAVY_IMPORT_WAIT_MS:20000}

# Async (@Async): bounded pool (avoid unbounded threads from SimpleAsyncTaskExecutor)
async.core-pool-size=${ASYNC_CORE_POOL_SIZE:4}
async.max-pool-size=${ASYNC_MAX_POOL_SIZE:16}
async.queue-capacity=${ASYNC_QUEUE_CAPACITY:500}

# QR / invoice image OCR runs on a dedicated small pool (bytes + APIs stay bounded)
ocr.executor.core-size=${OCR_EXECUTOR_CORE_SIZE:2}
ocr.executor.max-size=${OCR_EXECUTOR_MAX_SIZE:4}
ocr.executor.queue-capacity=${OCR_EXECUTOR_QUEUE_CAPACITY:100}

# SSE: close idle connections instead of indefinite retention (milliseconds)
sse.emitter-timeout-ms=${SSE_EMITTER_TIMEOUT_MS:1800000}

# Multipart (OCR invoice upload, Excel stock import). Parts are buffered to disk, not memory.
# OCR images are further capped at 2 MB each (ImageValidator.MAX_INVOICE_IMAGE_BYTES).
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# OCR: aws-textract | chatgpt | gemini
ocr.provider=${OCR_PROVIDER}
ocr.openai.model=${OCR_OPENAI_MODEL}
ocr.gemini.model=${OCR_GEMINI_MODEL}

# OCR PREPROCESS: none (default, pass-through) | subprocess + (python-path and working-dir) | http + (url)
ocr.preprocess.mode=${OCR_PREPROCESS_MODE}
ocr.preprocess.url=${OCR_PREPROCESS_URL}
ocr.preprocess.python-path=${OCR_PREPROCESS_PYTHON_PATH}
ocr.preprocess.working-dir=${OCR_PREPROCESS_WORKING_DIR}

# API Keys (required for chosen provider)
openai.api-key=${OPENAI_API_KEY}
gemini.api-key=${GEMINI_API_KEY}

# AWS (required when ocr.provider=aws-textract)
aws.access-key-id=${AWS_ACCESS_KEY}
aws.secret-access-key=${AWS_SECRET_ACCESS}
aws.region=${AWS_REGION}

# Upload Images
upload.token.expiry.minutes=${UPLOAD_TOKEN_EXPIRY_MINUTES}

# Plan (trial period for new shops)
plan.trial-days=${PLAN_TRIAL_DAYS:30}

# Dot-matrix print bridge offered to shops (core/product PrintBridgeProperties)
print-bridge.latest-version=${PRINT_BRIDGE_LATEST_VERSION:0.12.0}
print-bridge.minimum-version=${PRINT_BRIDGE_MINIMUM_VERSION:0.11.0}
print-bridge.origin=${PRINT_BRIDGE_ORIGIN:http://127.0.0.1:9110}
print-bridge.health-timeout-ms=${PRINT_BRIDGE_HEALTH_TIMEOUT_MS:1200}
print-bridge.print-timeout-ms=${PRINT_BRIDGE_PRINT_TIMEOUT_MS:8000}
print-bridge.download-url=${PRINT_BRIDGE_DOWNLOAD_URL:https://drive.google.com/file/d/1IDSkTohHat204Wcth9ehbK6ga2fwnACS/view?usp=drive_link}

# Payment gateway (razorpay | stripe | ...)
payment.gateway=${PAYMENT_GATEWAY:razorpay}
# GSTIN verification (taxation module). Provider: gstinapi | none. With `none` GSTINs are checked
# offline only (format + check character) and vendors still save. One network call per GSTIN ever:
# answers are kept in gstin_registry and shared by every shop.
gstin.provider=${GSTIN_PROVIDER:none}
gstin.gstinapi.api-key=${GSTINAPI_KEY:}
gstin.gstinapi.base-url=${GSTINAPI_BASE_URL:https://www.gstinapi.in}
gstin.lookup-timeout-seconds=8

payment.razorpay.key-id=${RAZORPAY_KEY_ID:}
payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
payment.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# Vertical plugin beans — ids/versions must match ACTIVE rows in vertical_schemas (MongoDB)
vertical.plugins.medical.id=${VERTICAL_MEDICAL_ID:medical}
vertical.plugins.medical.version=${VERTICAL_MEDICAL_VERSION:1.0.0}
vertical.plugins.grocery.id=${VERTICAL_GROCERY_ID:grocery}
vertical.plugins.grocery.version=${VERTICAL_GROCERY_VERSION:1.0.0}
vertical.plugins.sports.id=${VERTICAL_SPORTS_ID:sports}
vertical.plugins.sports.version=${VERTICAL_SPORTS_VERSION:1.0.0}
vertical.plugins.cafe.id=${VERTICAL_CAFE_ID:cafe}
vertical.plugins.cafe.version=${VERTICAL_CAFE_VERSION:1.0.0}

# Notifications (email via Resend)
messaging.dispatch-interval-ms=${MESSAGING_DISPATCH_INTERVAL_MS:15000}
messaging.email.enabled=${MESSAGING_EMAIL_ENABLED:false}
messaging.email.api-key=${RESEND_API_KEY}
messaging.email.from-email=${RESEND_FROM_EMAIL}
messaging.email.from-name=${RESEND_FROM_NAME}

# Auth: per-request login check remembered briefly (AuthCache); evicted on user/membership change on this instance
auth.cache.enabled=${AUTH_CACHE_ENABLED:true}
auth.cache.ttl-seconds=${AUTH_CACHE_TTL_SECONDS:60}
auth.cache.max-entries=${AUTH_CACHE_MAX_ENTRIES:10000}
# Nightly removal of expired login tokens from users (ExpiredTokenCleanupJob)
auth.token-cleanup.enabled=${AUTH_TOKEN_CLEANUP_ENABLED:true}
auth.token-cleanup.cron=${AUTH_TOKEN_CLEANUP_CRON:0 30 3 * * *}
auth.token-cleanup.zone=Asia/Kolkata
# Shop reads remembered across requests on this instance (ShopReadCache); cleared on any shop write here
shop.cache.enabled=${SHOP_CACHE_ENABLED:true}
shop.cache.ttl-seconds=${SHOP_CACHE_TTL_SECONDS:60}
shop.cache.max-entries=${SHOP_CACHE_MAX_ENTRIES:10000}
# Start-up check (log only) for shops whose own accounts already use the HR system codes 1250/2400/5700
stockkart.coa-conflict-check.enabled=${COA_CONFLICT_CHECK_ENABLED:true}
