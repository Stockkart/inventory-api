# Branch deploy: a pull request labelled `deploy:staging` is built and deployed to
# staging; every further push while the label is present redeploys. Never touches
# production. Fork PRs are refused (their workflows cannot receive secrets).
name: Branch → staging

on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  guard:
    name: Check label and origin
    runs-on: ubuntu-latest
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'deploy:staging') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'deploy:staging'))
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - name: Refuse pull requests from forks
        id: check
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          if [[ "$HEAD_REPO" != "$THIS_REPO" ]]; then
            {
              echo "## Branch deploy skipped"
              echo "This pull request comes from a fork (\`$HEAD_REPO\`). Fork workflows cannot receive the staging credentials, so it cannot be deployed to staging. Push the branch to this repository instead."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::fork PR — staging deploy skipped"
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build
    needs: guard
    if: needs.guard.outputs.allowed == 'true'
    uses: ./.github/workflows/_build-image.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
    secrets: inherit

  deploy-staging:
    name: Staging
    needs: build
    uses: ./.github/workflows/_deploy-staging.yml
    with:
      sha: ${{ needs.build.outputs.sha }}
    secrets: inherit

  comment:
    name: Comment on PR
    needs: [build, deploy-staging]
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Upsert staging status comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          SHA: ${{ needs.build.outputs.sha }}
          RESULT: ${{ needs.deploy-staging.result }}
          STAGING_URL: ${{ needs.deploy-staging.outputs.api_url }}
          DEPLOY_URL: ${{ needs.deploy-staging.outputs.deploy_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = '<!-- staging-deploy -->';
            const { SHA, RESULT, STAGING_URL, DEPLOY_URL, RUN_URL } = process.env;
            const ok = RESULT === 'success';
            const when = new Date().toISOString().replace('T', ' ').slice(0, 16) + ' UTC';
            const body = [
              marker,
              `### ${ok ? '🟢' : '🔴'} Staging ${ok ? 'now runs' : 'deploy failed for'} this PR`,
              '',
              `| | |`,
              `|---|---|`,
              `| Commit | ${SHA ? `\`${SHA.slice(0, 12)}\`` : '—'} |`,
              `| Staging API | ${STAGING_URL || '—'} |`,
              `| Render deploy | ${DEPLOY_URL ? `[open](${DEPLOY_URL})` : '—'} |`,
              `| Run | [logs](${RUN_URL}) |`,
              `| Updated | ${when} |`,
              '',
              ok
                ? 'Staging is shared: the next merge to `main`, or another labelled PR, will replace it. Remove the `deploy:staging` label to stop redeploying on push.'
                : 'See the run logs for the failing step. Staging keeps whatever was live before.',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
