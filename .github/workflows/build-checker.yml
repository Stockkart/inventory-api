name: Build Checker for inventory-backend

on:
  pull_request:
    branches:
      - main          # run checks on PRs targeting main
  workflow_dispatch:   # allow manual trigger from Actions tab

jobs:
  pr-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven repo
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Maven test (multi-module)
        run: mvn -pl app -am clean test

      # Throwaway MongoDB for the *IT tests (HR decision 4), published on the runner's loopback only.
      # It is a one-node replica set, because MongoTxIT, the Worker*IT classes in app and the
      # WorkerJoinService*Properties run real transactions and skip without one. A `services:`
      # container cannot be given `--replSet` (no `command:` key), so it is started by hand.
      - name: Start MongoDB (single-node replica set)
        run: |
          docker run -d --name mongo -p 127.0.0.1:27017:27017 --tmpfs /data/db mongo:7 --replSet rs0
          for _ in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval 'db.runCommand({ping: 1})' >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec mongo mongosh --quiet --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27017"}]})'
          for _ in $(seq 1 30); do
            [ "$(docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ] && exit 0
            sleep 1
          done
          echo "mongo did not become primary" >&2
          docker logs mongo >&2
          exit 1

      # *IT classes and the jqwik *Properties classes (common, user, hr, product) are skipped by
      # surefire's default pattern, so they are named here. The Mongo-backed ones run only when
      # stockkart.test.mongo.uri (plain) or stockkart.test.mongo.rs.uri (replica set, for
      # transactions) names a database; the rest run whenever they are selected.
      - name: Mongo integration tests (*IT) and property tests (*Properties)
        run: >-
          mvn -pl app -am test
          -Dtest='*IT,com.inventory.**.*Properties'
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dstockkart.test.mongo.uri=mongodb://127.0.0.1:27017/stockkart_test
          -Dstockkart.test.mongo.rs.uri='mongodb://127.0.0.1:27017/stockkart_test_rs?directConnection=true'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3