 services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: inventory-backend:local
    container_name: inventory-backend
    restart: unless-stopped
    environment:
      DB_URI: ${DB_URI}
      CLIENT_URL: ${CLIENT_URL}
      OCR_PROVIDER: ${OCR_PROVIDER}
      OCR_OPENAI_MODEL: ${OCR_OPENAI_MODEL}
      OCR_GEMINI_MODEL: ${OCR_GEMINI_MODEL}
      OCR_PREPROCESS_MODE: ${OCR_PREPROCESS_MODE:-http}
      OCR_PREPROCESS_URL: ${OCR_PREPROCESS_URL:-http://image-preprocess:8081/preprocess}
      OCR_PREPROCESS_PYTHON_PATH: ${OCR_PREPROCESS_PYTHON_PATH}
      OCR_PREPROCESS_WORKING_DIR: ${OCR_PREPROCESS_WORKING_DIR}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY}
      AWS_SECRET_ACCESS: ${AWS_SECRET_ACCESS}
      AWS_REGION: ${AWS_REGION}
      UPLOAD_TOKEN_EXPIRY_MINUTES: ${UPLOAD_TOKEN_EXPIRY_MINUTES}
      MESSAGING_DISPATCH_INTERVAL_MS: ${MESSAGING_DISPATCH_INTERVAL_MS:-15000}
      MESSAGING_EMAIL_ENABLED: ${MESSAGING_EMAIL_ENABLED:-false}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-notifications@example.com}
      RESEND_FROM_NAME: ${RESEND_FROM_NAME:-Stock Kart}
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-razorpay}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      GRAFANA_CLOUD_OTLP_URL: ${GRAFANA_CLOUD_OTLP_URL:-}
      GRAFANA_CLOUD_OTLP_USER: ${GRAFANA_CLOUD_OTLP_USER:-}
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL:-}
      GRAFANA_CLOUD_LOKI_USER: ${GRAFANA_CLOUD_LOKI_USER:-}
      GRAFANA_CLOUD_API_TOKEN: ${GRAFANA_CLOUD_API_TOKEN:-}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
    ports:
      - "8080:8080"
